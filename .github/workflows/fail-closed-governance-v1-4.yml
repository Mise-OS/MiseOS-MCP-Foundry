name: Fail-Closed Governance v1.4

on:
  pull_request:
    branches: [main]
    paths:
      - 'verification-lab/fail-closed-v1.4/**'
      - '.github/workflows/fail-closed-governance-v1-4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LAB: verification-lab/fail-closed-v1.4

jobs:
  tlc:
    name: TLC 1.7.4 finite exploration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Run SANY and TLC
        working-directory: ${{ env.LAB }}
        run: |
          set -euo pipefail
          mkdir -p .tools logs
          curl -L --fail --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o .tools/tla2tools.jar
          echo 'bee4a54f3ee3d4afc347c3240ec2d9e93b075104  .tools/tla2tools.jar' | sha1sum -c - | tee logs/hash.txt
          sha256sum .tools/tla2tools.jar | tee logs/sha256.txt
          java -cp .tools/tla2tools.jar tla2sany.SANY FreezeLifecycle9.tla 2>&1 | tee logs/sany.log
          java -XX:+UseParallelGC -jar .tools/tla2tools.jar -workers 1 -config FreezeLifecycle9.cfg FreezeLifecycle9.tla 2>&1 | tee logs/tlc.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tlc-logs-v1.4
          path: ${{ env.LAB }}/logs/

  apalache:
    name: Apalache 0.62.2 inductiveness
    needs: tlc
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Run inductive base, step, and implication
        working-directory: ${{ env.LAB }}
        run: |
          set -euo pipefail
          mkdir -p .tools logs
          curl -L --fail --retry 3 https://github.com/apalache-mc/apalache/releases/download/v0.62.2/apalache-0.62.2.tgz -o .tools/apalache.tgz
          echo '765f610537281a0f25b8c30f2554f19523e2859c824e80e62276653ee23c10e2  .tools/apalache.tgz' | sha256sum -c - | tee logs/hash.txt
          tar -xzf .tools/apalache.tgz -C .tools
          APALACHE=$(find .tools -type f -path '*/bin/apalache-mc' | head -1)
          test -n "$APALACHE"
          chmod +x "$APALACHE"
          "$APALACHE" version 2>&1 | tee logs/version.log
          "$APALACHE" check --no-deadlock --init=Init --inv=Inv --length=0 FreezeLifecycle9.tla 2>&1 | tee logs/base.log
          "$APALACHE" check --no-deadlock --init=Inv --inv=Inv --length=1 FreezeLifecycle9.tla 2>&1 | tee logs/step.log
          "$APALACHE" check --no-deadlock --init=Inv --inv=AllowImpliesPass --length=0 FreezeLifecycle9.tla 2>&1 | tee logs/implication.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apalache-logs-v1.4
          path: ${{ env.LAB }}/logs/

  lean:
    name: Lean 4.33.0 gate lemmas
    needs: apalache
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile three Lean lemmas
        working-directory: ${{ env.LAB }}
        run: |
          set -euo pipefail
          mkdir -p .tools logs
          curl -L --fail --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0/lean-4.33.0-linux.tar.zst -o .tools/lean.tar.zst
          echo '4b3fb03c29a1e0a253fb1d11f9bae3725f19a0dc6fc09b3ea16d2c9df3349e2c  .tools/lean.tar.zst' | sha256sum -c - | tee logs/hash.txt
          tar --zstd -xf .tools/lean.tar.zst -C .tools
          LEAN=$(find .tools -type f -path '*/bin/lean' | head -1)
          test -n "$LEAN"
          "$LEAN" --version 2>&1 | tee logs/version.log
          "$LEAN" Authority.lean 2>&1 | tee logs/lean.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-logs-v1.4
          path: ${{ env.LAB }}/logs/

  cedar:
    name: Cedar CLI 4.12.0 parse and authorization
    needs: lean
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Parse and authorize promotion cases
        working-directory: ${{ env.LAB }}
        run: |
          set -euo pipefail
          mkdir -p .tools logs
          curl -L --fail --retry 3 https://github.com/cedar-policy/cedar/releases/download/cedar-policy-cli-v4.12.0/cedar-policy-cli-x86_64-unknown-linux-gnu.tar.xz -o .tools/cedar.tar.xz
          echo 'fc29b830bca41763c7cbb6ce66d1a14040fc2d077318479512c6a83052b70851  .tools/cedar.tar.xz' | sha256sum -c - | tee logs/hash.txt
          tar -xJf .tools/cedar.tar.xz -C .tools
          CEDAR=$(find .tools -type f -name cedar | head -1)
          test -n "$CEDAR"
          chmod +x "$CEDAR"
          "$CEDAR" --version 2>&1 | tee logs/version.log
          "$CEDAR" check-parse --policies promotion.cedar 2>&1 | tee logs/parse.log
          "$CEDAR" authorize --policies promotion.cedar --entities entities.json --principal 'User::"ci"' --action 'Action::"promote"' --resource 'Claim::"pass"' -v 2>&1 | tee logs/allow.log
          grep -qx 'ALLOW' logs/allow.log
          set +e
          "$CEDAR" authorize --policies promotion.cedar --entities entities.json --principal 'User::"ci"' --action 'Action::"promote"' --resource 'Claim::"indeterminate"' -v 2>&1 | tee logs/deny.log
          DENY_RC=${PIPESTATUS[0]}
          set -e
          echo "cedar_authorize_exit=$DENY_RC" | tee logs/deny-exit.txt
          grep -qx 'DENY' logs/deny.log
          "$CEDAR" check-parse --policies promotion-error.cedar 2>&1 | tee logs/error-parse.log
          "$CEDAR" authorize --policies promotion-error.cedar --entities entities.json --principal 'User::"ci"' --action 'Action::"promote"' --resource 'Claim::"pass"' -v 2>&1 | tee logs/diagnostic.log
          grep -qx 'ALLOW' logs/diagnostic.log
          grep -qiE 'error|diagnostic_guard|erroring_forbid' logs/diagnostic.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cedar-logs-v1.4
          path: ${{ env.LAB }}/logs/
