name: Repository Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository control plane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts f }'
      - name: Validate required surfaces
        run: |
          test -f README.md
          test -f .github/workflows/mise-repo-steward.yml
          test -d src
          test -d plugin
      - name: Validate MCP JavaScript syntax
        run: node --check plugin/mcp/gateway.mjs && node --check plugin/mcp/developer-bot.mjs && node --check plugin/mcp/developer-bot-core.mjs && node --check plugin/mcp/openrouter-client.mjs && node --check plugin/mcp/character-cards.mjs
      - name: Test OpenRouter free developer bot
        run: node --test plugin/tests/*.test.mjs
