name: PR Conductor

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
      - edited

  # Trusted retry pass.
  # Particularly useful for stacked PRs and fork PRs.
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-conductor-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  conductor:
    name: PR Conductor
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Inspect and conduct pull requests
        shell: bash
        run: |
          set -Eeuo pipefail

          API_VERSION="2026-03-10"
          MARKER="<!-- pr-conductor -->"

          api() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "$@"
          }

          has_label() {
            local wanted="$1"
            printf '%s\n' "${LABELS[@]:-}" | grep -Fxq "$wanted"
          }

          upsert_comment() {
            local pr="$1"
            local body="$2"
            local comment_id

            comment_id="$(
              api --paginate "repos/${GH_REPO}/issues/${pr}/comments" \
                --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
                | head -n 1 || true
            )"

            if [[ -n "${comment_id}" ]]; then
              api \
                --method PATCH \
                "repos/${GH_REPO}/issues/comments/${comment_id}" \
                -f body="$body" >/dev/null
            else
              api \
                --method POST \
                "repos/${GH_REPO}/issues/${pr}/comments" \
                -f body="$body" >/dev/null
            fi
          }

          make_title() {
            local current="$1"
            local branch="$2"

            local kind=""
            local scope=""
            local clean=""
            local prefix=""

            for label in "${LABELS[@]:-}"; do
              case "$label" in
                type:feat|type:feature)
                  kind="feat"
                  ;;
                type:fix|type:bug)
                  kind="fix"
                  ;;
                type:docs)
                  kind="docs"
                  ;;
                type:refactor)
                  kind="refactor"
                  ;;
                type:perf)
                  kind="perf"
                  ;;
                type:test)
                  kind="test"
                  ;;
                type:build)
                  kind="build"
                  ;;
                type:ci)
                  kind="ci"
                  ;;
                type:chore)
                  kind="chore"
                  ;;
                scope:*)
                  scope="${label#scope:}"
                  ;;
              esac
            done

            if [[ -z "$kind" ]]; then
              case "$branch" in
                feat/*|feature/*)
                  kind="feat"
                  ;;
                fix/*|bugfix/*|bug/*)
                  kind="fix"
                  ;;
                docs/*)
                  kind="docs"
                  ;;
                refactor/*)
                  kind="refactor"
                  ;;
                test/*|tests/*)
                  kind="test"
                  ;;
                ci/*)
                  kind="ci"
                  ;;
                build/*)
                  kind="build"
                  ;;
                *)
                  kind="chore"
                  ;;
              esac
            fi

            # Remove an existing Conventional Commit-style prefix.
            clean="$(
              printf '%s' "$current" |
                sed -E \
                  's/^(feat|fix|docs|refactor|perf|test|build|ci|chore)(\([^)]*\))?!?:[[:space:]]*//'
            )"

            # Keep scope Git/title friendly.
            if [[ -n "$scope" ]]; then
              scope="$(
                printf '%s' "$scope" |
                  tr '[:upper:] ' '[:lower:]-' |
                  tr -cd 'a-z0-9._/-'
              )"
              prefix="${kind}(${scope})"
            else
              prefix="$kind"
            fi

            printf '%s: %s' "$prefix" "$clean"
          }

          choose_strategy() {
            local base="$1"
            local commits="$2"

            local explicit=0
            local selected=""

            if has_label "merge:squash"; then
              explicit=$((explicit + 1))
              selected="squash"
            fi

            if has_label "merge:rebase"; then
              explicit=$((explicit + 1))
              selected="rebase"
            fi

            if has_label "merge:commit"; then
              explicit=$((explicit + 1))
              selected="merge"
            fi

            if (( explicit > 1 )); then
              printf 'conflict'
              return
            fi

            if (( explicit == 1 )); then
              printf '%s' "$selected"
              return
            fi

            # Automatic policy.
            if [[ "$base" =~ ^(release|hotfix)/ ]]; then
              printf 'merge'
            elif (( commits <= 1 )); then
              printf 'rebase'
            else
              printf 'squash'
            fi
          }

          process_pr() {
            local pr="$1"

            echo "::group::PR #${pr}"

            local data
            data="$(api "repos/${GH_REPO}/pulls/${pr}")"

            local state
            local draft
            local title
            local head_ref
            local base_ref
            local head_repo
            local head_sha
            local commits
            local stack
            local mergeable_state
            local strategy
            local new_title
            local mode
            local status

            state="$(jq -r '.state' <<<"$data")"

            if [[ "$state" != "open" ]]; then
              echo "PR #${pr} is not open."
              echo "::endgroup::"
              return
            fi

            draft="$(jq -r '.draft // false' <<<"$data")"
            title="$(jq -r '.title' <<<"$data")"
            head_ref="$(jq -r '.head.ref' <<<"$data")"
            base_ref="$(jq -r '.base.ref' <<<"$data")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$data")"
            head_sha="$(jq -r '.head.sha' <<<"$data")"
            commits="$(jq -r '.commits // 1' <<<"$data")"
            mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$data")"

            stack="$(
              jq -r \
                'if .stack == null then "false" else "true" end' \
                <<<"$data"
            )"

            mapfile -t LABELS < <(
              jq -r '.labels[]?.name' <<<"$data"
            )

            #
            # pull_request workflows from forks have intentionally
            # restricted credentials. Let the scheduled trusted run
            # process those instead.
            #
            if [[ "$EVENT_NAME" == "pull_request" &&
                  "$head_repo" != "$GH_REPO" ]]; then
              echo "Fork PR detected. Deferring write operations to scheduled pass."
              echo "::endgroup::"
              return
            fi

            strategy="$(choose_strategy "$base_ref" "$commits")"

            if [[ "$strategy" == "conflict" ]]; then
              upsert_comment "$pr" \
"${MARKER}
**PR Conductor:** merge paused — multiple merge strategy labels are present.

Use exactly one of:
\`merge:squash\`, \`merge:rebase\`, or \`merge:commit\`."

              echo "::endgroup::"
              return
            fi

            #
            # Normalize PR title.
            #
            new_title="$(make_title "$title" "$head_ref")"

            if [[ "$new_title" != "$title" ]]; then
              api \
                --method PATCH \
                "repos/${GH_REPO}/pulls/${pr}" \
                -f title="$new_title" >/dev/null
            fi

            #
            # Hard stop controls.
            #
            if [[ "$draft" == "true" ]]; then
              upsert_comment "$pr" \
"${MARKER}
**PR Conductor:** draft detected · strategy \`${strategy}\` selected · merge paused until the PR is ready."

              echo "::endgroup::"
              return
            fi

            if has_label "merge:hold"; then
              upsert_comment "$pr" \
"${MARKER}
**PR Conductor:** \`merge:hold\` is active · strategy \`${strategy}\` selected · no merge action taken."

              echo "::endgroup::"
              return
            fi

            if [[ "$mergeable_state" == "dirty" ]]; then
              upsert_comment "$pr" \
"${MARKER}
**PR Conductor:** merge conflict detected · automatic merge paused until conflicts are resolved."

              echo "::endgroup::"
              return
            fi

            #
            # STANDALONE PR
            #
            if [[ "$stack" != "true" ]]; then
              mode="standalone"

              #
              # Rebase stale same-repository branches automatically.
              #
              if [[ "$mergeable_state" == "behind" &&
                    "$head_repo" == "$GH_REPO" ]] &&
                    ! has_label "rebase:off"; then

                if gh pr update-branch \
                    "$pr" \
                    --repo "$GH_REPO" \
                    --rebase; then

                  upsert_comment "$pr" \
"${MARKER}
**PR Conductor:** branch rebased onto \`${base_ref}\` · CI will rerun · merge strategy \`${strategy}\`."

                  echo "::endgroup::"
                  return
                fi
              fi

              merge_args=()

              case "$strategy" in
                squash)
                  merge_args+=(--squash)
                  ;;
                rebase)
                  merge_args+=(--rebase)
                  ;;
                merge)
                  merge_args+=(--merge)
                  ;;
              esac

              #
              # Enable GitHub auto-merge.
              # GitHub will still enforce reviews, required CI,
              # rulesets, CODEOWNERS, etc.
              #
              if gh pr merge \
                  "$pr" \
                  --repo "$GH_REPO" \
                  --auto \
                  "${merge_args[@]}" \
                  --subject "$new_title"; then

                status="auto-merge enabled"
              else
                #
                # Merge queues may control the strategy themselves.
                # Retry without forcing a merge method.
                #
                if gh pr merge \
                    "$pr" \
                    --repo "$GH_REPO" \
                    --auto; then
                  status="merge queue / auto-merge enabled"
                else
                  status="waiting for repository merge requirements"
                fi
              fi

              upsert_comment "$pr" \
"${MARKER}
**PR Conductor:** ${status} · mode \`${mode}\` · strategy \`${strategy}\`."

              echo "::endgroup::"
              return
            fi

            #
            # STACKED PR
            #
            mode="stack"

            #
            # GitHub stacked PRs need a linear stack.
            # Do not force-push an entire stack from this metadata
            # workflow. GitHub will automatically retarget/rebase
            # remaining layers after lower layers land.
            #
            if [[ "$mergeable_state" == "behind" ]]; then
              upsert_comment "$pr" \
"${MARKER}
**PR Conductor:** stacked PR detected · stack currently needs a cascading rebase · strategy \`${strategy}\`.

The conductor will retry automatically after the stack becomes linear."

              echo "::endgroup::"
              return
            fi

            #
            # GitHub requires the asynchronous endpoint for
            # programmatic stacked-PR merges.
            #
            set +e

            stack_response="$(
              api \
                --method PUT \
                "repos/${GH_REPO}/pulls/${pr}/merge-async" \
                -f sha="$head_sha" \
                -f merge_method="$strategy" \
                -f merge_action="default" \
                -f commit_title="$new_title" \
                -f commit_message="Merged by PR Conductor." \
                2>&1
            )"

            stack_rc=$?

            set -e

            if (( stack_rc == 0 )); then
              stack_status="$(
                jq -r '.status // "requested"' \
                  <<<"$stack_response" \
                  2>/dev/null || printf 'requested'
              )"

              status="stack merge ${stack_status}"
            else
              status="stack merge waiting on GitHub requirements"
            fi

            upsert_comment "$pr" \
"${MARKER}
**PR Conductor:** ${status} · mode \`${mode}\` · strategy \`${strategy}\` · GitHub will preserve stack order."

            echo "::endgroup::"
          }

          #
          # Event-driven: process the PR that changed.
          # Scheduled/manual: sweep all open PRs.
          #
          if [[ "$EVENT_NAME" == "pull_request" &&
                -n "${EVENT_PR:-}" ]]; then
            process_pr "$EVENT_PR"
          else
            mapfile -t OPEN_PRS < <(
              gh pr list \
                --repo "$GH_REPO" \
                --state open \
                --limit 100 \
                --json number \
                --jq '.[].number'
            )

            for pr in "${OPEN_PRS[@]:-}"; do
              process_pr "$pr"
            done
          fi
